# Nsight Systems profile of the DP=2 baseline (same Qwen3-1.7B run as
# experiment-01) - wraps rank 0's torchrun in `nsys profile`, then runs
# `nsys stats --report cuda_gpu_kern_sum` on the resulting .nsys-rep and
# prints the kernel-time breakdown straight to stdout (captured via
# `kubectl logs`), so no binary artifact needs to leave the cluster to read
# the result. Rank 1 runs the plain (unprofiled) torchrun, same as
# experiment-01 - both ranks are needed for the collectives regardless, but
# only rank 0's kernel breakdown is what we're after here.
#
# Compare this pod's kernel breakdown against ../k8s/profile-tp.yaml's - the
# whole point is seeing NCCL kernels go from a rounding error (DP: one
# all-reduce per step, on the *gradients*) to a large, visible chunk (TP:
# one all-reduce per transformer layer per microbatch, on *activations*) -
# see ../README.md's Nsight Systems section for the actual numbers.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-profdp-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-profdp-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-profdp-worker-0
  namespace: default
  labels:
    app: qwen3-profdp-worker
spec:
  hostname: qwen3-profdp-worker-0
  subdomain: qwen3-profdp-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-profdp-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-profdp-worker-0.qwen3-profdp-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: MAX_STEPS
          value: "20"
        - name: GLOBAL_BATCH_SIZE
          value: "4"
        - name: MICRO_BATCH_SIZE
          value: "2"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: nsys-profile-dp-qwen3-1p7b-2gpu
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 DP=2 baseline UNDER NSYS - node-rank=$NODE_RANK ==="
          nsys profile --trace=cuda,nvtx,osrt --force-overwrite=true \
            -o /tmp/profile_dp \
            torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
              --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
              /scripts/run_experiment.py \
              --model qwen3-1p7b \
              --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
              --micro-batch-size "$MICRO_BATCH_SIZE" \
              --approx-num-params "$APPROX_NUM_PARAMS" \
              --mlflow-run-name "$MLFLOW_RUN_NAME"
          echo "=== nsys stats: top CUDA kernels by total GPU time (DP=2) ==="
          nsys stats --report cuda_gpu_kern_sum --format column /tmp/profile_dp.nsys-rep
      resources:
        limits:
          nvidia.com/gpu: 1
---
