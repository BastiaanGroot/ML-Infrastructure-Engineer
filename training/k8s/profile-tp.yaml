# Nsight Systems profile of the TP=2 run (same Qwen3-1.7B run as
# experiment-02) - counterpart to ./profile-dp.yaml, identical mechanism:
# rank 0's torchrun wrapped in `nsys profile`, followed by
# `nsys stats --report cuda_gpu_kern_sum` printed to stdout. Rank 1 runs
# unprofiled. See ../README.md's Nsight Systems section for the comparison.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-proftp-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-proftp-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-proftp-worker-0
  namespace: default
  labels:
    app: qwen3-proftp-worker
spec:
  hostname: qwen3-proftp-worker-0
  subdomain: qwen3-proftp-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-proftp-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-proftp-worker-0.qwen3-proftp-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: MAX_STEPS
          value: "20"
        - name: TENSOR_PARALLELISM
          value: "2"
        - name: GLOBAL_BATCH_SIZE
          value: "2"
        - name: MICRO_BATCH_SIZE
          value: "2"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: nsys-profile-tp-qwen3-1p7b-2gpu
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 TP=2 UNDER NSYS - node-rank=$NODE_RANK ==="
          nsys profile --trace=cuda,nvtx,osrt --force-overwrite=true \
            -o /tmp/profile_tp \
            torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
              --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
              /scripts/run_experiment.py \
              --model qwen3-1p7b --tensor-parallelism "$TENSOR_PARALLELISM" \
              --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
              --micro-batch-size "$MICRO_BATCH_SIZE" \
              --approx-num-params "$APPROX_NUM_PARAMS" \
              --mlflow-run-name "$MLFLOW_RUN_NAME" --run-kind profile
          echo "=== nsys stats: top CUDA kernels by total GPU time (TP=2) ==="
          nsys stats --report cuda_gpu_kern_sum --format column /tmp/profile_tp.nsys-rep
      resources:
        limits:
          nvidia.com/gpu: 1
---
