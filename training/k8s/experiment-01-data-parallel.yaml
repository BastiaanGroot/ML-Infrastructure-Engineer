# Experiment 1: Qwen3-1.7B baseline, Data Parallel (DP=2) across our two
# live 1-GPU nodes. Uses Megatron-Bridge's qwen3_1p7b.pretrain_config() recipe
# with tensor_parallelism=1/pipeline_parallelism=1 (defaults) - torchrun's
# world size of 2 turns the two independent single-GPU replicas into DP=2
# automatically. See ../README.md and ../../docs/training-strategy-outline.md.
#
# No custom image/Dockerfile: nvcr.io/nvidia/nemo ships Megatron-Bridge
# pre-installed; our own thin ../scripts/run_experiment.py (mounted from the
# qwen3-training-scripts ConfigMap - apply ./scripts-configmap.yaml first)
# calls its recipe + pretrain() APIs and logs to MLflow, since the
# Megatron-Bridge version in this container predates its own generic
# run_recipe.py launcher and native MLflow logging support.
#
# Headless Service gives each worker Pod a stable DNS name
# (<hostname>.qwen3-dp-headless.default.svc.cluster.local) for torchrun
# rendezvous, without a StatefulSet or an extra operator.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-dp-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-dp-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-dp-worker-0
  namespace: default
  labels:
    app: qwen3-dp-worker
spec:
  hostname: qwen3-dp-worker-0
  subdomain: qwen3-dp-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-dp-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    # PyTorch's DataLoader multiprocessing workers need real shared memory -
    # the container default /dev/shm (64MB) isn't enough and fails with
    # "OSError: [Errno 28] No space left on device" on the first batch.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-dp-worker-0.qwen3-dp-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: TENSOR_PARALLELISM
          value: "1"
        - name: MAX_STEPS
          value: "20"
        - name: GLOBAL_BATCH_SIZE
          value: "4"
        - name: MICRO_BATCH_SIZE
          value: "2"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          # From `terraform output mlflow_tracking_endpoint` (infra/README.md).
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: dp-baseline-qwen3-1p7b
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 DP=2 baseline - node-rank=$NODE_RANK ==="
          torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
            --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
            /scripts/run_experiment.py \
            --model qwen3-1p7b --tensor-parallelism "$TENSOR_PARALLELISM" \
            --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
            --micro-batch-size "$MICRO_BATCH_SIZE" \
            --approx-num-params "$APPROX_NUM_PARAMS" \
            --mlflow-run-name "$MLFLOW_RUN_NAME"
      resources:
        limits:
          nvidia.com/gpu: 1
---
