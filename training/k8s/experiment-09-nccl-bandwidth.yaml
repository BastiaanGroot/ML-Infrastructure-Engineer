  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "1"
        - name: MASTER_ADDR
          value: nccl-bw-worker-0.nccl-bw-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: MLFLOW_TRACKING_URI
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: nccl-allreduce-bandwidth-2gpu
      volumeMounts:
