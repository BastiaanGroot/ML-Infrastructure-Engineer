# Experiment 4: Qwen3-1.7B, Context Parallel (CP=2) across the same two
# 1-GPU nodes, at a 4x longer sequence length (16384 vs the 4096 used in
# experiments 1-3) - CP's whole reason to exist is amortizing attention's
# memory/compute over long sequences by splitting the *sequence* dimension
# across GPUs (each GPU holds half the tokens, with ring-style attention
# communication to see the other half's KV). See experiment-04b for the
# matched DP=2 long-sequence baseline (CP=1, same seq_length) this should be
# compared against - CP is a single-variable change from that baseline, not
# from experiments 1-3 (which use the 4096 default).
#
# Same "no custom image" + ConfigMap-mounted launch script + headless-Service
# rendezvous approach as experiment-01/02/03. See ../README.md and
# ../../docs/training-strategy-outline.md.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-cp-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-cp-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-cp-worker-0
  namespace: default
  labels:
    app: qwen3-cp-worker
spec:
  hostname: qwen3-cp-worker-0
  subdomain: qwen3-cp-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-cp-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    # PyTorch's DataLoader multiprocessing workers need real shared memory -
    # the container default /dev/shm (64MB) isn't enough and fails with
    # "OSError: [Errno 28] No space left on device" on the first batch.
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-cp-worker-0.qwen3-cp-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: CONTEXT_PARALLELISM
          value: "2"
        - name: SEQ_LENGTH
          value: "16384"
        - name: MAX_STEPS
          value: "20"
        - name: GLOBAL_BATCH_SIZE
          value: "1"
        - name: MICRO_BATCH_SIZE
          value: "1"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          # From `terraform output mlflow_tracking_endpoint` (infra/README.md).
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: cp-qwen3-1p7b-2gpu-seq16384
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 CP=2 seq=16384 - node-rank=$NODE_RANK ==="
          torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
            --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
            /scripts/run_experiment.py \
            --model qwen3-1p7b --context-parallelism "$CONTEXT_PARALLELISM" \
            --seq-length "$SEQ_LENGTH" \
            --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
            --micro-batch-size "$MICRO_BATCH_SIZE" \
            --approx-num-params "$APPROX_NUM_PARAMS" \
            --mlflow-run-name "$MLFLOW_RUN_NAME"
      resources:
        limits:
          nvidia.com/gpu: 1
---
