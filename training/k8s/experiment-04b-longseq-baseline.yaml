# Experiment 4b: Qwen3-1.7B, plain Data Parallel (DP=2, CP=1) at the SAME
# 16384 sequence length as experiment-04's CP=2 run. This is the actual
# single-variable comparison for CP: experiment-04 vs this file changes only
# context_parallelism (1 -> 2) at a fixed, long sequence length - unlike
# comparing experiment-04 against experiment-01's DP=2 baseline, which would
# also change seq_length (4096 -> 16384) at the same time.
#
# Expect this to need noticeably more peak GPU memory than experiment-04:
# each GPU here processes the *full* 16384-token sequence per sample, while
# CP=2 splits that same sequence in half across the two GPUs. If this OOMs
# on a single H200 while experiment-04 doesn't, that's itself the point CP
# exists to make - documented honestly in ../README.md either way.
#
# Same "no custom image" + ConfigMap-mounted launch script + headless-Service
# rendezvous approach as experiment-01/02/03/04. See ../README.md and
# ../../docs/training-strategy-outline.md.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-dplong-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-dplong-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-dplong-worker-0
  namespace: default
  labels:
    app: qwen3-dplong-worker
spec:
  hostname: qwen3-dplong-worker-0
  subdomain: qwen3-dplong-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-dplong-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-dplong-worker-0.qwen3-dplong-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: SEQ_LENGTH
          value: "16384"
        - name: MAX_STEPS
          value: "20"
        - name: GLOBAL_BATCH_SIZE
          value: "2"
        - name: MICRO_BATCH_SIZE
          value: "1"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: dp-longseq-baseline-qwen3-1p7b-seq16384
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 DP=2 seq=16384 (CP baseline) - node-rank=$NODE_RANK ==="
          torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
            --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
            /scripts/run_experiment.py \
            --model qwen3-1p7b --seq-length "$SEQ_LENGTH" \
            --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
            --micro-batch-size "$MICRO_BATCH_SIZE" \
            --approx-num-params "$APPROX_NUM_PARAMS" \
            --mlflow-run-name "$MLFLOW_RUN_NAME"
      resources:
        limits:
          nvidia.com/gpu: 1
---
