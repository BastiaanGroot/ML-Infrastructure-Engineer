# Experiment 8: Qwen3-1.7B, Data Parallel (DP=2), activation CPU offload -
# otherwise identical to experiment-01's DP=2 baseline (same model, same
# TP/PP/batch sizes) so only --cpu-offload differs. Sets
# model.cpu_offloading=True/cpu_offloading_activations=True and offloads
# every layer's activations (cpu_offloading_num_layers=model.num_layers) to
# host RAM between the forward and backward pass, trading PCIe transfer
# time for GPU HBM headroom - the mechanism a client would reach for once a
# model/batch no longer fits even with TP/PP/CP maxed out.
#
# Same "no custom image" + ConfigMap-mounted launch script + headless-Service
# rendezvous approach as the other experiments. See ../README.md and
# ../../docs/training-strategy-outline.md.
apiVersion: v1
kind: Service
metadata:
  name: qwen3-offload-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: qwen3-offload-worker
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen3-offload-worker-0
  namespace: default
  labels:
    app: qwen3-offload-worker
spec:
  hostname: qwen3-offload-worker-0
  subdomain: qwen3-offload-headless
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - {key: app, operator: In, values: [qwen3-offload-worker]}
          topologyKey: kubernetes.io/hostname
  volumes:
    - name: scripts
      configMap:
        name: qwen3-training-scripts
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
  containers:
    - name: worker
      image: nvcr.io/nvidia/nemo:25.09
      envFrom:
        - secretRef:
            name: mlflow-creds
      env:
        - name: NODE_RANK
          value: "0"
        - name: MASTER_ADDR
          value: qwen3-offload-worker-0.qwen3-offload-headless.default.svc.cluster.local
        - name: MASTER_PORT
          value: "29500"
        - name: MAX_STEPS
          value: "20"
        - name: GLOBAL_BATCH_SIZE
          value: "4"
        - name: MICRO_BATCH_SIZE
          value: "2"
        - name: APPROX_NUM_PARAMS
          value: "1.7e9"
        - name: MLFLOW_TRACKING_URI
          # From `terraform output mlflow_tracking_endpoint` (infra/README.md).
          value: "https://public-tracking-e00-qq5esxe7w0zwk32-tyaqmja4khghyam-mlflow.gw.msp.eu-north1.nebius.cloud"
        - name: MLFLOW_RUN_NAME
          value: cpu-offload-qwen3-1p7b-2gpu
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          pip install --quiet mlflow-skinny
          cd /opt/Megatron-Bridge
          export PYTHONPATH=/opt/Megatron-Bridge/src:/opt/megatron-lm:${PYTHONPATH:-}
          echo "=== Qwen3 DP=2 CPU offload - node-rank=$NODE_RANK ==="
          torchrun --nnodes=2 --nproc-per-node=1 --node-rank="$NODE_RANK" \
            --master-addr="$MASTER_ADDR" --master-port="$MASTER_PORT" \
            /scripts/run_experiment.py \
            --model qwen3-1p7b --cpu-offload \
            --train-iters "$MAX_STEPS" --global-batch-size "$GLOBAL_BATCH_SIZE" \
            --micro-batch-size "$MICRO_BATCH_SIZE" \
            --approx-num-params "$APPROX_NUM_PARAMS" \
            --mlflow-run-name "$MLFLOW_RUN_NAME"
      resources:
        limits:
          nvidia.com/gpu: 1
---
