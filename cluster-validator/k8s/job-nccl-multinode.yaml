# Multi-node InfiniBand NCCL check: 2 nodes x 8 GPUs = 16 GPUs total,
# matching the PoC capacity. Requires the MPI Operator to be installed on
# the cluster (https://github.com/kubeflow/mpi-operator).
#
# Written but never run (needs the MPI Operator + the future 8-GPU node
# group + InfiniBand fabric - see the root README's "Future hardware:
# 2x8-GPU nodes with InfiniBand"). The :v1 tag below is the same image used
# by job-validate.yaml - untested against this manifest's mpirun/MPIJob
# path specifically, so re-verify once the switch happens.
#
# This bypasses our image's default entrypoint (run.sh) and instead invokes
# the bundled all_reduce_perf binary directly via mpirun, following the same
# pattern as Nebius's own docs:
# https://docs.nebius.com/kubernetes/gpu/nccl-test
#
# Adjust image, GPU counts (slotsPerWorker / nvidia.com/gpu), and NCCL/UCX
# network device names to match your actual node group + fabric.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: cluster-validator-nccl-multinode
  namespace: default
spec:
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - name: nccl-launcher
              image: cr.eu-north1.nebius.cloud/e00qprtt5j85j3syw7/cluster-validator:v1
              command:
                - /bin/bash
                - -c
                - |
                  mpirun -np 16 -bind-to none -x LD_LIBRARY_PATH \
                    -x NCCL_DEBUG=INFO -x NCCL_SOCKET_IFNAME=eth0 \
                    -mca coll ^hcoll \
                    -x UCX_NET_DEVICES=eth0 \
                    -x NCCL_IB_HCA=mlx5 \
                    -x NCCL_COLLNET_ENABLE=0 \
                    all_reduce_perf -b 512M -e 8G -f 2 -g 1
              env:
                - name: OMPI_ALLOW_RUN_AS_ROOT
                  value: "1"
                - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
                  value: "1"
    Worker:
      replicas: 2
      template:
        spec:
          containers:
            - name: nccl-worker
              image: cr.eu-north1.nebius.cloud/e00qprtt5j85j3syw7/cluster-validator:v1
              resources:
                limits:
                  nvidia.com/gpu: 8
