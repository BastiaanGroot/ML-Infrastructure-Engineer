# Single-node validation Job: GPU health + single-node NCCL + storage
# throughput (network disk via PVC, shared filesystem via hostPath).
#
# Adjust:
#   - image: points at the cluster-validator image pushed to the Nebius
#     Container Registry (registry-e00qprtt5j85j3syw7 in ml-infra-poc):
#     cr.eu-north1.nebius.cloud/e00qprtt5j85j3syw7/cluster-validator:latest
#   - nvidia.com/gpu: match the node's GPU count
#   - the shared-fs hostPath to match how your node group mounts it
#     (see the mount_tag/cloud-init in your node group spec)
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-validator
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cluster-validator
          image: cr.eu-north1.nebius.cloud/e00qprtt5j85j3syw7/cluster-validator:test
          env:
            - name: STORAGE_PATHS
              value: "/mnt/network-disk,/mnt/shared-fs"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: network-disk
              mountPath: /mnt/network-disk
            - name: shared-fs
              mountPath: /mnt/shared-fs
      volumes:
        - name: network-disk
          persistentVolumeClaim:
            claimName: cluster-validator-network-disk
        - name: shared-fs
          hostPath:
            path: /mnt/filesystem-s6
            type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-validator-network-disk
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
