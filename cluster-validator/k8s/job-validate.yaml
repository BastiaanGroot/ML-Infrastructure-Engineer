# Per-node validation Job: one pod on each GPU node (Indexed Job, pod
# anti-affinity) running GPU health + single-node NCCL + LLM smoketest +
# storage throughput (network disk + shared filesystem). Cross-node
# InfiniBand is checked separately by job-validate-multinode.yaml.
#
# Adjust:
#   - completions/parallelism: the number of GPU nodes
#   - image: the cluster-validator image in your Container Registry
#   - nvidia.com/gpu: match the node's GPU count
#   - the shared-fs hostPath to match how your node group mounts it
#     (see the mount_tag/cloud-init in your node group spec)
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-validator
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cluster-validator
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cluster-validator
              topologyKey: kubernetes.io/hostname
      # Requires a `nebius-registry` imagePullSecret if the node group's
      # service account lacks Container Registry viewer access — see
      # cluster-validator/README.md "Pulling the image" section.
      imagePullSecrets:
        - name: nebius-registry
      containers:
        - name: cluster-validator
          image: cr.eu-north1.nebius.cloud/e00qprtt5j85j3syw7/cluster-validator:v7
          envFrom:
            - secretRef:
                # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the logs
                # bucket upload below - see cluster-validator/README.md
                # "Uploading logs to Object Storage".
                name: cluster-validator-logs-creds
                optional: true
          env:
            - name: STORAGE_PATHS
              value: "/mnt/network-disk,/mnt/shared-fs"
            - name: UPLOAD_LOGS_BUCKET
              value: "ml-infra-poc-logs"
          resources:
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: network-disk
              mountPath: /mnt/network-disk
            - name: shared-fs
              mountPath: /mnt/shared-fs
      volumes:
        # A fresh network disk per pod, deleted with it. 2Ti matches the
        # PoC's 2TB network disk (Nebius network SSD throughput scales with size).
        - name: network-disk
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 2Ti
        - name: shared-fs
          hostPath:
            path: /mnt/filesystem-s6
            type: Directory
